name: smart_lesson_planner
description: AI-powered lesson plan generator for K-12 teachers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  provider: ^6.1.2
  intl: ^0.19.0
  share_plus: ^12.0.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  shared_preferences: ^2.3.0
  package_info_plus: ^8.1.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
