name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, release]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Create signing config from secret
        run: |
          echo "storeFile=upload-keystore.pfx" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeType=PKCS12" >> android/key.properties

      - name: Optionally override google-services.json from secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
            echo "[CI] Overwrote google-services.json from GOOGLE_SERVICES_JSON_B64 secret"
          else
            echo "[CI] Using committed google-services.json"
          fi

      - name: Verify google-services.json
        run: |
          # Validate JSON
          if python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "[CI] google-services.json: VALID JSON"
          else
            echo "[CI] google-services.json: INVALID JSON — aborting"
            python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>&1 || true
            exit 1
          fi

          # Debug: show size + first/last lines (safe — no secrets)
          echo "[CI] Bytes: $(wc -c < android/app/google-services.json) | Lines: $(wc -l < android/app/google-services.json)"
          echo "[CI] First 3 lines:"
          head -n 3 android/app/google-services.json
          echo "[CI] Last 2 lines:"
          tail -n 2 android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk